<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Store — K8s Deploy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; color: #333; }
    header { background: #2c3e50; color: #fff; text-align: center; padding: 28px 20px; }
    header h1 { font-size: 28px; margin-bottom: 6px; }
    header p  { font-size: 13px; color: #bdc3c7; }
    main { max-width: 860px; margin: 28px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 22px; box-shadow: 0 2px 6px rgba(0,0,0,.09); }
    .card h2 { font-size: 17px; color: #2c3e50; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
    button { width: 100%; padding: 10px; background: #3498db; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #2980b9; }
    .btn-refresh { background: #ecf0f1; color: #2c3e50; margin-bottom: 12px; }
    .btn-refresh:hover { background: #dde4e9; }
    .message { margin-top: 8px; font-size: 13px; color: #27ae60; min-height: 18px; }
    .error { color: #e74c3c; }
    .product-item { border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .product-name { font-weight: bold; font-size: 14px; }
    .product-cat  { font-size: 11px; color: #888; }
    .product-price{ font-size: 15px; font-weight: bold; color: #27ae60; }
    .btn-del { background: #fee; color: #e74c3c; border: 1px solid #fcc; border-radius: 6px; padding: 4px 9px; font-size: 12px; width: auto; cursor: pointer; }
    footer { text-align: center; color: #999; font-size: 12px; padding: 18px; margin-top: 10px; }
    @media(max-width:600px){ main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>📦 Product Store</h1>
    <p>Deployed on Kubernetes — Three-Tier Architecture</p>
  </header>
  <main>
    <div class="card">
      <h2>➕ Add Product</h2>
      <label>Name</label>
      <input id="pName" placeholder="e.g. Laptop" />
      <label>Price (₹)</label>
      <input id="pPrice" type="number" placeholder="e.g. 45000" />
      <label>Category</label>
      <select id="pCat">
        <option>Electronics</option><option>Clothing</option>
        <option>Books</option><option>Home</option>
      </select>
      <button onclick="addProduct()">Add Product</button>
      <p id="msg" class="message"></p>
    </div>
    <div class="card">
      <h2>📋 All Products</h2>
      <button class="btn-refresh" onclick="loadProducts()">🔄 Refresh</button>
      <div id="list"><p style="color:#aaa;font-size:13px">Click Refresh to load...</p></div>
    </div>
  </main>
  <footer>Tier 1 (HTML:3000) → Tier 2 (Node.js:5000) → Tier 3 (PostgreSQL:5432)</footer>

  <script>
    // In Kubernetes, backend is accessed via the backend-service name
    // Change this to your minikube IP + nodePort if accessing from outside cluster
    const API = 'http://localhost:30050/api';

    async function loadProducts() {
      const list = document.getElementById('list');
      list.innerHTML = '<p style="color:#aaa;font-size:13px">Loading...</p>';
      try {
        const r = await fetch(API + '/products');
        const products = await r.json();
        if (!products.length) { list.innerHTML = '<p style="color:#aaa;font-size:13px">No products yet.</p>'; return; }
        list.innerHTML = products.map(p => `
          <div class="product-item">
            <div><div class="product-name">${p.name}</div><div class="product-cat">${p.category}</div></div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="product-price">₹${p.price}</span>
              <button class="btn-del" onclick="deleteProduct(${p.id})">Del</button>
            </div>
          </div>`).join('');
      } catch { list.innerHTML = '<p style="color:#e74c3c;font-size:13px">❌ Cannot reach backend. Is K8s running?</p>'; }
    }

    async function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const category = document.getElementById('pCat').value;
      const msg = document.getElementById('msg');
      if (!name || !price) { msg.textContent = '⚠️ Fill in name and price'; msg.className='message error'; return; }
      try {
        await fetch(API + '/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,price:+price,category}) });
        msg.textContent = '✅ Product added!'; msg.className = 'message';
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        loadProducts();
      } catch { msg.textContent = '❌ Failed. Backend down?'; msg.className='message error'; }
    }

    async function deleteProduct(id) {
      if (!confirm('Delete?')) return;
      await fetch(API + '/products/' + id, { method: 'DELETE' });
      loadProducts();
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
