ckend-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
        labels:
              app: backend

              spec:
                  replicas: 2

                      selector:
                            matchLabels:
                                    app: backend

                                        template:
                                              metadata:
                                                      labels:
                                                                app: backend

                                                                      spec:
                                                                              containers:
                                                                                      - name: backend
                                                                                                image: backend-app:latest
                                                                                                          imagePullPolicy: Never

                                                                                                                    ports:
                                                                                                                              - containerPort: 5000

                                                                                                                                        env:
                                                                                                                                                  - name: DB_HOST
                                                                                                                                                              value: "postgres-service"

                                                                                                                                                                        - name: DB_PORT
                                                                                                                                                                                    value: "5432"

                                                                                                                                                                                              - name: DB_NAME
                                                                                                                                                                                                          value: "mystore"

                                                                                                                                                                                                                    - name: DB_USER
                                                                                                                                                                                                                                value: "postgres"

                                                                                                                                                                                                                                          - name: DB_PASSWORD
                                                                                                                                                                                                                                                      value: "mypassword"

                                                                                                                                                                                                                                          ---
                                                                                                                                                                                                                                apiVersion: v1
                                                                                                                                                                                                                                kind: Service
                                                                                                                                                                                                                                metadata:
                                                                                                                                                                                                                                    name: backend-service

                                                                                                                                                                                                                                    spec:
                                                                                                                                                                                                                                        type: NodePort

                                                                                                                                                                                                                                            selector:
                                                                                                                                                                                                                                                  app: backend

                                                                                                                                                                                                                                                      ports:
                                                                                                                                                                                                                                                          - port: 5000
                                                                                                                                                                                                                                                                targetPort: 5000
                                                                                                                                                                                                                                                                      nodePort: 30050
